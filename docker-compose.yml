version: "3.8"

services:
  inventory-service:
    build: ./inventory-service
    ports:
      - "3001:3001"
    environment:
      - PORT=3001

  order-service:
    build: ./order-service
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - INVENTORY_SERVICE_URL=http://inventory-service:3001
    depends_on:
      - inventory-service
